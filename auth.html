<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kohinoor Academy — Kirish</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root {
  --blue: #1126db;
  --blue-light: #3b5bfc;
  --blue-glow: rgba(59,91,252,0.35);
  --white: #ffffff;
  --text-dim: rgba(255,255,255,0.6);
  --input-bg: rgba(255,255,255,0.08);
  --input-border: rgba(255,255,255,0.15);
  --input-focus: rgba(59,91,252,0.6);
  --card-bg: rgba(10,14,60,0.7);
  --error: #ff4d6d;
  --success: #22c55e;
}

html, body {
  height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: #060b2e;
  overflow: hidden;
}

/* ===== BACKGROUND ===== */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: radial-gradient(ellipse at 20% 50%, #0d1a6e 0%, #060b2e 60%),
              radial-gradient(ellipse at 80% 20%, #0a0f4a 0%, transparent 50%);
}

canvas#bgCanvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  opacity: 0.5;
}

/* ===== LAYOUT ===== */
.auth-wrapper {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 1rem;
}

.auth-container {
  display: grid;
  grid-template-columns: 480px 1fr;
  min-height: 580px;
  max-width: 1100px;
  width: 100%;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
}

/* ===== LEFT: FORM PANEL ===== */
.form-panel {
  background: var(--card-bg);
  padding: 3rem 3rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid rgba(255,255,255,0.06);
  position: relative;
}

.logo-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 2.5rem;
  text-decoration: none;
}

.logo-top .logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, #7e73c2, #1126db);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  color: white;
  font-size: 1.1rem;
}

.logo-top span {
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: white;
}
.logo-top span b { color: #6c9fff; font-weight: 700; }

/* Tabs */
.auth-tabs {
  display: flex;
  gap: 0;
  margin-bottom: 2rem;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 4px;
}

.auth-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  border-radius: 9px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text-dim);
  transition: all 0.25s;
  border: none;
  background: transparent;
  font-family: 'DM Sans', sans-serif;
}

.auth-tab.active {
  background: linear-gradient(135deg, #3b5bfc, #1126db);
  color: white;
  box-shadow: 0 4px 16px rgba(17,38,219,0.4);
}

/* Form panels */
.form-section { display: none; }
.form-section.active { display: block; }

.form-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: white;
  margin-bottom: 0.3rem;
}

.form-sub {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 1.8rem;
}

/* Input groups */
.input-group {
  position: relative;
  margin-bottom: 1rem;
}

.input-group .input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 1rem;
  pointer-events: none;
}

.input-group input {
  width: 100%;
  padding: 13px 14px 13px 42px;
  background: var(--input-bg);
  border: 1.5px solid var(--input-border);
  border-radius: 12px;
  color: white;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem;
  outline: none;
  transition: all 0.2s;
}

.input-group input::placeholder { color: rgba(255,255,255,0.35); }
.input-group input:focus {
  border-color: var(--input-focus);
  background: rgba(59,91,252,0.08);
  box-shadow: 0 0 0 3px rgba(59,91,252,0.15);
}

.toggle-pass {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 1rem;
  padding: 2px;
  line-height: 1;
}

.field-err {
  color: var(--error);
  font-size: 0.75rem;
  margin-top: -0.6rem;
  margin-bottom: 0.5rem;
  min-height: 1rem;
  padding-left: 4px;
}

/* Buttons */
.btn-main {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #3b5bfc, #1126db);
  color: white;
  border: none;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
  margin-top: 0.5rem;
  position: relative;
  overflow: hidden;
}

.btn-main:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(17,38,219,0.45);
}

.btn-main:active { transform: translateY(0); }

.btn-main.loading::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #3b5bfc, #1126db);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Divider */
.or-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 1.2rem 0;
  color: var(--text-dim);
  font-size: 0.82rem;
}
.or-divider::before, .or-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.1);
}

/* Google btn */
.btn-google {
  width: 100%;
  padding: 12px;
  background: white;
  border: none;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.92rem;
  font-weight: 600;
  color: #1a1a2e;
  cursor: pointer;
  transition: all 0.25s;
}

.btn-google:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.google-icon {
  width: 20px;
  height: 20px;
}

.switch-auth {
  text-align: center;
  margin-top: 1.2rem;
  font-size: 0.85rem;
  color: var(--text-dim);
}

.switch-auth a {
  color: #6c9fff;
  cursor: pointer;
  font-weight: 600;
  text-decoration: none;
}

.switch-auth a:hover { text-decoration: underline; }

/* Alert */
.auth-alert {
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 0.82rem;
  margin-bottom: 1rem;
  display: none;
}
.auth-alert.error { background: rgba(255,77,109,0.15); border: 1px solid rgba(255,77,109,0.3); color: #ff8fa3; }
.auth-alert.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }
.auth-alert.show { display: block; }

/* Back link */
.back-link {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  color: var(--text-dim);
  text-decoration: none;
  font-size: 0.82rem;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.2s;
}
.back-link:hover { color: white; }

/* ===== RIGHT: 3D LOGO PANEL ===== */
.visual-panel {
  position: relative;
  background: linear-gradient(135deg, rgba(5,10,50,0.9), rgba(10,20,80,0.7));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  perspective: 1000px;
}

.logo-3d-wrap {
  width: 340px;
  height: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  transform-style: preserve-3d;
  position: relative;
  z-index: 2;
}

.logo-3d-wrap:active { cursor: grabbing; }

.logo-3d-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  filter: drop-shadow(0 0 30px rgba(59,91,252,0.5)) drop-shadow(0 0 60px rgba(17,38,219,0.3));
  pointer-events: none;
  user-select: none;
  transition: filter 0.3s;
}

.logo-3d-wrap:hover img {
  filter: drop-shadow(0 0 40px rgba(59,91,252,0.7)) drop-shadow(0 0 80px rgba(17,38,219,0.5));
}

/* Glow ring behind logo */
.logo-glow-ring {
  position: absolute;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(59,91,252,0.15) 0%, transparent 70%);
  animation: pulseGlow 3s ease-in-out infinite;
  z-index: 1;
}

@keyframes pulseGlow {
  0%, 100% { transform: scale(1); opacity: 0.6; }
  50% { transform: scale(1.1); opacity: 1; }
}

/* Orbiting particles */
.orbit-ring {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(100,150,255,0.15);
  animation: orbitSpin linear infinite;
}
.orbit-ring-1 { width: 380px; height: 380px; animation-duration: 12s; }
.orbit-ring-2 { width: 440px; height: 440px; animation-duration: 18s; animation-direction: reverse; border-color: rgba(100,150,255,0.08); }
.orbit-dot {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #3b5bfc;
  top: -3px;
  left: 50%;
  margin-left: -3px;
  box-shadow: 0 0 8px rgba(59,91,252,0.8);
}
@keyframes orbitSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.visual-caption {
  position: absolute;
  bottom: 2.5rem;
  text-align: center;
  pointer-events: none;
  z-index: 3;
}

.visual-caption h3 {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  color: white;
  margin-bottom: 0.4rem;
}

.visual-caption p {
  font-size: 0.82rem;
  color: var(--text-dim);
}

.drag-hint {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 6px 14px;
  font-size: 0.75rem;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 5;
}

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .auth-container { grid-template-columns: 1fr; max-width: 460px; }
  .visual-panel { display: none; }
  .form-panel { padding: 2.5rem 2rem; }
  html, body { overflow: auto; }
}

@media (max-width: 480px) {
  .form-panel { padding: 2rem 1.5rem; border-radius: 0; }
  .auth-container { border-radius: 20px; }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1e1e3a;
  color: white;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 0.88rem;
  z-index: 9999;
  opacity: 0;
  transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
  border: 1px solid rgba(255,255,255,0.1);
  white-space: nowrap;
}
.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
</style>
</head>
<body>

<div class="auth-wrapper">

            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-CJRKHDzrrEq9M1mLM7NsrRG9l0kjyJs",
  authDomain: "kohinoor-academy.firebaseapp.com",
  projectId: "kohinoor-academy",
  storageBucket: "kohinoor-academy.firebasestorage.app",
  messagingSenderId: "201579385267",
  appId: "1:201579385267:web:1ee52c028f097ebe16bbc6",
  measurementId: "G-9YPC5JND19"
};

const ADMIN_EMAIL = "abdurasul1406z@gmail.com";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

// Auth state listener
onAuthStateChanged(auth, (user) => {
  if (user) {
    if (user.email === ADMIN_EMAIL) {
      window.location.href = "index.html#admin";
    } else {
      window.location.href = "index.html";
    }
  }
});

// LOGIN
window.doLogin = async function() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  clearErrors('login');

  let valid = true;
  if (!email) { showFieldErr('login-email-err', 'Email kiriting'); valid = false; }
  else if (!/\S+@\S+\.\S+/.test(email)) { showFieldErr('login-email-err', "Email noto'g'ri formatda"); valid = false; }
  if (!pass) { showFieldErr('login-pass-err', 'Parol kiriting'); valid = false; }
  if (!valid) return;

  setLoading('btn-login', true);
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    showToast('✅ Muvaffaqiyatli kirdingiz!');
  } catch(e) {
    setLoading('btn-login', false);
    showAlert('login-alert', 'error', getFirebaseError(e.code));
  }
};

// REGISTER
window.doRegister = async function() {
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  clearErrors('reg');

  let valid = true;
  if (!email) { showFieldErr('reg-email-err', 'Email kiriting'); valid = false; }
  else if (!/\S+@\S+\.\S+/.test(email)) { showFieldErr('reg-email-err', "Email noto'g'ri formatda"); valid = false; }
  if (!pass) { showFieldErr('reg-pass-err', 'Parol kiriting'); valid = false; }
  else if (pass.length < 6) { showFieldErr('reg-pass-err', "Parol kamida 6 ta belgi bo'lishi kerak"); valid = false; }
  if (!pass2) { showFieldErr('reg-pass2-err', 'Parolni tasdiqlang'); valid = false; }
  else if (pass !== pass2) { showFieldErr('reg-pass2-err', "Parollar mos kelmadi"); valid = false; }
  if (!valid) return;

  setLoading('btn-register', true);
  try {
    await createUserWithEmailAndPassword(auth, email, pass);
    showToast("✅ Hisob muvaffaqiyatli yaratildi!");
  } catch(e) {
    setLoading('btn-register', false);
    showAlert('reg-alert', 'error', getFirebaseError(e.code));
  }
};

// GOOGLE
window.doGoogle = async function() {
  try {
    await signInWithPopup(auth, googleProvider);
    showToast('✅ Google orqali kirdingiz!');
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') {
      showToast('❌ ' + getFirebaseError(e.code));
    }
  }
};

// Helpers
function getFirebaseError(code) {
  const map = {
    'auth/user-not-found': "Bu email bilan hisob topilmadi",
    'auth/wrong-password': "Parol noto'g'ri",
    'auth/email-already-in-use': "Bu email allaqachon ro'yxatdan o'tgan",
    'auth/invalid-email': "Email noto'g'ri formatda",
    'auth/too-many-requests': "Juda ko'p urinish. Keyinroq urinib ko'ring",
    'auth/network-request-failed': "Internet aloqasini tekshiring",
    'auth/invalid-credential': "Email yoki parol noto'g'ri",
  };
  return map[code] || "Xatolik yuz berdi. Qayta urinib ko'ring";
}

function showFieldErr(id, msg) {
  const el = document.getElementById(id);
  if(el) el.textContent = msg;
}

function clearErrors(prefix) {
  ['email-err','pass-err','pass2-err'].forEach(s => {
    const el = document.getElementById(prefix+'-'+s);
    if(el) el.textContent = '';
  });
  const alert = document.getElementById(prefix+'-alert') || document.getElementById(prefix+'Alert');
  if(alert) { alert.className = 'auth-alert'; alert.textContent = ''; }
}

function showAlert(id, type, msg) {
  const el = document.getElementById(id);
  if(!el) return;
  el.className = 'auth-alert ' + type + ' show';
  el.textContent = msg;
}

function setLoading(btnId, on) {
  const btn = document.getElementById(btnId);
  if(!btn) return;
  if(on) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Yuklanmoqda...';
  } else {
    btn.disabled = false;
    btn.innerHTML = btnId === 'btn-login' ? 'Kirish' : "Ro'yxatdan o'tish";
  }
}
</script>

<script>
// ===== TAB SWITCH =====
function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('section-login').classList.toggle('active', tab === 'login');
  document.getElementById('section-register').classList.toggle('active', tab === 'register');
}

// ===== TOGGLE PASSWORD =====
function togglePass(inputId, btn) {
  const inp = document.getElementById(inputId);
  if(inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
  else { inp.type = 'password'; btn.textContent = '👁'; }
}

// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== BACKGROUND PARTICLES =====
(function() {
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.5 + 0.3,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      a: Math.random() * 0.5 + 0.1
    });
  }

  function drawBg() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if(p.x < 0) p.x = W; if(p.x > W) p.x = 0;
      if(p.y < 0) p.y = H; if(p.y > H) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(100,150,255,${p.a})`;
      ctx.fill();
    });
    requestAnimationFrame(drawBg);
  }
  drawBg();
})();

// ===== 3D LOGO — MOUSE DRAG ROTATE =====
(function() {
  const wrap = document.getElementById('logo3d');
  if(!wrap) return;

  let rotX = -10, rotY = 15;
  let targetRX = -10, targetRY = 15;
  let isDragging = false;
  let lastX = 0, lastY = 0;
  let autoRotate = true;
  let autoT = 0;
  let rafId;

  // Mouse events
  wrap.addEventListener('mousedown', e => {
    isDragging = true;
    autoRotate = false;
    lastX = e.clientX;
    lastY = e.clientY;
    wrap.style.transition = 'none';
  });

  window.addEventListener('mousemove', e => {
    if(!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    targetRY += dx * 0.5;
    targetRX -= dy * 0.5;
    targetRX = Math.max(-45, Math.min(45, targetRX));
    lastX = e.clientX;
    lastY = e.clientY;
  });

  window.addEventListener('mouseup', () => {
    if(!isDragging) return;
    isDragging = false;
    setTimeout(() => { autoRotate = true; }, 2500);
  });

  // Touch events
  wrap.addEventListener('touchstart', e => {
    isDragging = true;
    autoRotate = false;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    e.preventDefault();
  }, {passive: false});

  window.addEventListener('touchmove', e => {
    if(!isDragging) return;
    const dx = e.touches[0].clientX - lastX;
    const dy = e.touches[0].clientY - lastY;
    targetRY += dx * 0.5;
    targetRX -= dy * 0.5;
    targetRX = Math.max(-45, Math.min(45, targetRX));
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  });

  window.addEventListener('touchend', () => {
    isDragging = false;
    setTimeout(() => { autoRotate = true; }, 2500);
  });

  // Hover tilt effect
  wrap.addEventListener('mousemove', e => {
    if(isDragging) return;
    const rect = wrap.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const dx = (e.clientX - cx) / (rect.width / 2);
    const dy = (e.clientY - cy) / (rect.height / 2);
    targetRY = dx * 25;
    targetRX = -dy * 20;
  });

  wrap.addEventListener('mouseleave', () => {
    if(!isDragging && autoRotate) {
      targetRX = -10;
      targetRY = 15;
    }
  });

  function animate() {
    autoT += 0.01;

    if(autoRotate && !isDragging) {
      targetRY += 0.4;
      targetRX = Math.sin(autoT * 0.5) * 12 - 5;
    }

    rotX += (targetRX - rotX) * 0.08;
    rotY += (targetRY - rotY) * 0.08;

    wrap.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;

    rafId = requestAnimationFrame(animate);
  }

  animate();
})();
</script>
